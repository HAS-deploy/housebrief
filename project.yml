name: HouseBrief
options:
  bundleIdPrefix: com.housebrief
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "NH2XFPC9KN"
    CODE_SIGN_STYLE: Automatic

targets:
  HouseBrief:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HouseBrief
        excludes:
          - "**/.DS_Store"
    resources:
      - HouseBrief/Resources/Assets.xcassets
      - HouseBrief/Resources/PrivacyInfo.xcprivacy
    info:
      path: HouseBrief/Resources/Info.plist
      properties:
        CFBundleDisplayName: HouseBrief
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housebrief.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  HouseBriefTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HouseBriefTests
    dependencies:
      - target: HouseBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housebrief.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HouseBrief:
    build:
      targets:
        HouseBrief: all
        HouseBriefTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HouseBriefTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
